<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>何切 Demo · nanikiru（引擎实时判分）</title>
<style>
  body { font-family: -apple-system,"PingFang SC",sans-serif; background:#efece3; color:#3a352c;
         margin:0; padding:28px 32px; max-width:900px; }
  h1 { font-size:19px; margin:0 0 2px; }
  .sub { color:#8a8374; font-size:13px; margin:0 0 24px; }
  .hand { display:flex; gap:6px; flex-wrap:wrap; align-items:flex-end; margin:10px 0 18px; }
  .hand .tile { cursor:pointer; transition: transform .12s ease, filter .12s ease;
                filter: drop-shadow(0 3px 4px rgba(45,36,15,.4)); background:none; border:none; padding:0; }
  .hand .tile:hover { transform: translateY(-6px); }
  .hand .tile.sel { transform: translateY(-10px); filter: drop-shadow(0 3px 4px rgba(45,36,15,.4)) drop-shadow(0 0 6px rgba(194,58,43,.8)); }
  .panel { background:#faf7ef; border:1px solid #e3dece; border-radius:12px; padding:18px 20px; }
  .verdict { font-size:17px; font-weight:700; margin-bottom:10px; }
  .verdict.ok { color:#1d6b40; } .verdict.ng { color:#b7271d; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th,td { text-align:left; padding:6px 10px; border-bottom:1px solid #eee7d6; }
  th { color:#8a8374; font-weight:600; font-size:12px; }
  td.best { color:#1d6b40; font-weight:700; }
  .mini { display:inline-block; vertical-align:-4px; margin-right:2px;
          filter: drop-shadow(0 1px 1.5px rgba(45,36,15,.35)); }
  .meta { color:#8a8374; font-size:12px; margin-top:10px; line-height:1.7; }
  button { font-size:14px; padding:8px 18px; border-radius:9px; border:1px solid #d5cdb4;
           background:#fffdf6; cursor:pointer; margin-right:10px; }
  button:hover { background:#f2ecda; }
  .shanten { font-size:13px; color:#6d675a; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gFace" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffdf6"/><stop offset=".55" stop-color="#f5eedb"/><stop offset="1" stop-color="#e7dcc2"/>
  </linearGradient>
  <linearGradient id="gSide" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d5cbae"/><stop offset=".45" stop-color="#bfb28f"/><stop offset="1" stop-color="#9a8d6a"/>
  </linearGradient>
</defs></svg>

<h1>何切 Demo</h1>
<p class="sub">点选一张切牌，引擎（@nanikiru/engine）实时判分并给出进张对比 · 判分口径：进张数优先</p>

<div class="shanten" id="meta"></div>
<div class="hand" id="hand"></div>
<div>
  <button onclick="nextHand()">换一题（随机）</button>
  <button onclick="loadHand(curated.pop() ?? randomHand())">下一题（精选）</button>
</div>
<div id="panel" class="panel" style="margin-top:18px; display:none;"></div>

<p class="meta">引擎判定 = 最优切牌集合（进张张数并列者全部算对）；表内为各切牌候选的切后向听与进张张数。<br>
牌面为程序化占位渲染（正式牌面美术另行筹备中）。</p>

<script src="engine.iife.js"></script>
<script>
/* ---------- 程序化牌面（占位级）：shell + 34 种内容 ---------- */
const C = { G:"#2e8b4a", R:"#c23a2b", B:"#2f4f9e", ink:"#1c2c54" };
const MINCHO = '"Hiragino Mincho ProN","Yu Mincho","Songti SC","Noto Serif CJK SC",serif';

const shell = `
  <rect x="5" y="11" width="110" height="164" rx="13" fill="url(#gSide)"/>
  <rect x="5" y="6" width="110" height="165" rx="13" fill="url(#gFace)"/>
  <rect x="6.8" y="8" width="106.4" height="161" rx="11.5" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="1.6"/>
  <rect x="9.5" y="11" width="101" height="156" rx="9.5" fill="none" stroke="rgba(115,98,60,.16)" stroke-width="1"/>`;

const pin = (x,y,r,col) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" stroke="rgba(0,0,0,.25)"/><circle cx="${x+r*.28}" cy="${y-r*.3}" r="${r*.24}" fill="rgba(255,255,255,.35)"/>`;
const stick = (x,y,h,col) => `<rect x="${x}" y="${y}" width="13" height="${h}" rx="5.5" fill="${col}" stroke="rgba(0,0,0,.2)"/><rect x="${x}" y="${y+h/2-6}" width="13" height="12" fill="rgba(0,0,0,.18)"/><rect x="${x+2.5}" y="${y+4}" width="2" height="${h-8}" rx="1" fill="rgba(255,255,255,.3)"/>`;
function manGlyph(numChar) {
  return `<g font-family='${MINCHO}' text-anchor="middle" font-weight="600">
    <text x="60.8" y="52" font-size="34" fill="rgba(255,255,255,.85)">${numChar}</text>
    <text x="60" y="51" font-size="34" fill="${C.ink}">${numChar}</text>
    <text x="60.9" y="146" font-size="70" fill="rgba(255,255,255,.8)">萬</text>
    <text x="60" y="145" font-size="70" fill="#bc3226">萬</text></g>`;
}

/* 饼：每张牌的圆点布局 [x,y,r,色] */
const PIN_LAYOUTS = {
  1: [[60,94,38,C.B],[60,94,22,"#f4eed9"],[60,94,14,C.R]],
  2: [[60,54,28,C.G],[60,134,28,C.R]],
  3: [[42,50,24,C.B],[60,94,24,C.R],[78,138,24,C.B]],
  4: [[42,58,24,C.B],[78,58,24,C.B],[42,130,24,C.G],[78,130,24,C.G]],
  5: [[40,56,22,C.G],[80,56,22,C.G],[60,94,24,C.R],[40,132,22,C.G],[80,132,22,C.G]],
  6: [[44,52,18,C.G],[76,52,18,C.G],[44,94,18,C.G],[76,94,18,C.G],[44,136,18,C.G],[76,136,18,C.G]],
  7: [[42,44,17,C.G],[60,40,17,C.G],[78,44,17,C.G],[40,102,17,C.R],[80,102,17,C.R],[40,140,17,C.R],[80,140,17,C.R]],
  8: [[34,56,12,C.B],[57,56,12,C.B],[80,56,12,C.B],[103,56,12,C.B],[34,132,12,C.B],[57,132,12,C.B],[80,132,12,C.B],[103,132,12,C.B]],
  9: [[40,46,14,C.G],[60,46,14,C.G],[80,46,14,C.G],[40,94,14,C.R],[60,94,14,C.R],[80,94,14,C.R],[40,142,14,C.B],[60,142,14,C.B],[80,142,14,C.B]],
};
/* 索：棒布局 [x,y,h,色] */
function souSticks(n) {
  const L = { 2:[[53,30,120],[73,30,120]], 3:[[42,30,120],[60,30,120],[78,30,120]],
    4:[[40,30,58],[79,30,58],[40,92,58],[79,92,58]],
    5:[[40,30,58],[79,30,58],[60,61,58],[40,92,58],[79,92,58]],
    6:[[36,30,58],[60,30,58],[84,30,58],[36,92,58],[60,92,58],[84,92,58]],
    7:[[36,26,46],[60,22,46],[84,26,46],[40,84,46],[58,96,46],[76,108,46],[94,120,46]],
    8:[[33,30,58],[57,30,58],[81,30,58],[105,30,58],[33,92,58],[57,92,58],[81,92,58],[105,92,58]],
    9:[[40,30,40],[69,30,40],[98,30,40],[40,82,40],[69,82,40],[98,82,40],[40,134,40],[69,134,40],[98,134,40]] }[n];
  const cols = [C.G, C.R, C.B];
  return L.map((s, i) => stick(s[0], s[1], s[2], cols[i % 3]));
}

const HONOR = { E:["東",C.ink], S:["南",C.ink], W:["西",C.ink], N:["北",C.ink],
                h:[null,null], f:["發",C.G], c:["中",C.R] };

function tileContent(kind) {
  const suit = kind[1], num = +kind[0];
  if (suit === "m") return manGlyph("一二三四五六七八九"[num-1]);
  if (suit === "p") return PIN_LAYOUTS[num].map(c => pin(...c)).join("");
  if (suit === "s") return num === 1
    ? `<g>${pin(60,66,16,C.R)}${pin(48,88,14,C.B)}${pin(72,88,14,C.B)}${pin(56,110,14,C.G)}${pin(66,116,13,C.G)}${pin(46,116,13,C.G)}${stick(53,132,30,C.G)}</g>`
    : souSticks(num).join("");
  const [ch, col] = HONOR[kind];
  if (!ch) return `<rect x="32" y="36" width="56" height="108" rx="7" fill="none" stroke="rgba(72,94,146,.25)" stroke-width="2.2"/>`;
  return `<g font-family='${MINCHO}' text-anchor="middle" font-weight="600">
    <text x="61" y="122" font-size="86" fill="rgba(255,255,255,.8)">${ch}</text>
    <text x="60" y="121" font-size="86" fill="${col}">${ch}</text></g>`;
}

function tileSVG(kind, w) {
  const h = Math.round(w * 1.5);
  return `<svg class="face" width="${w}" height="${h}" viewBox="0 0 120 180">${shell}${tileContent(kind)}</svg>`;
}
function tileMini(kind, w = 22) { return tileSVG(kind, w); }

/* ---------- 出题与判分 ---------- */
const HANDS_CURATED = [
  ["1m","2m","3m","5m","6m","3p","4p","5p","6p","7p","8p","2s","2s","4s"],   // PRD A.2 样例
  ["1m","2m","3m","4p","5p","6p","7s","8s","9s","2s","2s","4s","4s","4s"],   // 切面子留两面
  ["1m","2m","3m","4m","5m","6m","1p","2p","4p","5p","7s","8s","3s","9m"],   // 六搭整理
];
let curated = [...HANDS_CURATED];
let analysis = null, handTiles = null;

function randomHand() {
  // 随机 13 张 + 随机摸 1 张；已和了的重新生成
  for (;;) {
    const h = NKEngine.randomHand13(Math.random);
    const counts = NKEngine.toCounts(h, 13);
    const choices = [];
    for (let i = 0; i < 34; i++) if (counts[i] < 4) choices.push(i);
    const extra = choices[Math.floor(Math.random() * choices.length)];
    counts[extra]++;
    const hand = NKEngine.countsToHand(counts);
    if (!NKEngine.isWin(counts)) return hand;
  }
}

function loadHand(hand) {
  analysis = NKEngine.analyze14(hand);
  handTiles = hand;
  const shantenText = analysis.shanten === 0 ? "切最优牌后听牌" : `切最优牌后 ${analysis.shanten} 向听`;
  document.getElementById("meta").innerHTML =
    `当前手牌（14 张）· <b>${shantenText}</b>`;
  const el = document.getElementById("hand");
  el.innerHTML = "";
  for (const t of hand) {
    const b = document.createElement("button");
    b.className = "tile";
    b.innerHTML = tileSVG(t, 46);
    b.title = t;
    b.onclick = () => judge(t, b);
    el.appendChild(b);
  }
  document.getElementById("panel").style.display = "none";
}

function judge(discard, btn) {
  for (const b of document.querySelectorAll("#hand .tile")) b.classList.remove("sel");
  btn.classList.add("sel");
  const bestSet = NKEngine.bestDiscards(analysis);
  const isBest = bestSet.includes(discard);
  const mine = analysis.candidates.find(c => c.discard === discard);
  const top = analysis.candidates.slice(0, 8);
  const rows = top.map((c, i) => {
    const best = (c.shantenAfter === top[0].shantenAfter && c.ukeireCount === top[0].ukeireCount);
    return `<tr>
      <td class="${best ? "best" : ""}">${tileMini(c.discard)} ${c.discard}</td>
      <td>${c.shantenAfter === 0 ? "听牌" : c.shantenAfter + " 向听"}</td>
      <td>${c.ukeireCount} 张</td>
      <td style="color:#8a8374">${c.ukeireTiles.join(" ") || "—"}</td></tr>`;
  }).join("");
  document.getElementById("panel").style.display = "";
  document.getElementById("panel").innerHTML = `
    <div class="verdict ${isBest ? "ok" : "ng"}">${
      isBest ? `✅ 正确！切 ${discard} 是最优（进张 ${mine.ukeireCount} 张）`
             : `❌ 切 ${discard} 后 ${mine.shantenAfter === 0 ? "听牌" : mine.shantenAfter + " 向听"}、进张 ${mine.ukeireCount} 张；最优应切：${bestSet.join(" / ")}`
    }</div>
    <table><tr><th>切牌</th><th>切后</th><th>进张</th><th>进张种类</th></tr>${rows}</table>`;
}

function nextHand() { loadHand(randomHand()); }

loadHand(curated.shift());
</script>

<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gFace" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fffdf6"/><stop offset=".55" stop-color="#f5eedb"/><stop offset="1" stop-color="#e7dcc2"/>
  </linearGradient>
  <linearGradient id="gSide" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d5cbae"/><stop offset=".45" stop-color="#bfb28f"/><stop offset="1" stop-color="#9a8d6a"/>
  </linearGradient>
</defs></svg>

</body>
</html>
